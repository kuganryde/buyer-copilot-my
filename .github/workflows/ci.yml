name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE: pin third-party actions to full commit SHAs (Dependabot updates them; see dependabot.yml).
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: engine } }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: copilot }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      PGPASSWORD: ci
      COPILOT_TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/copilot
      COPILOT_TEST_APP_DATABASE_URL: postgresql://copilot_it:ci@localhost:5432/copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - name: Install (pinned)
        run: pip install -r requirements.txt && pip install -e ".[dev]"
      - name: Lint (ruff incl. flake8-bandit rules)
        run: ruff check copilot_engine tests
      - name: SAST (bandit)
        run: bandit -q -r copilot_engine -s B608   # B608 reviewed: constant column lists only, values bound
      - name: Seed SQL in sync with JSON
        run: python ../scripts/gen_seed.py --check
      - name: Apply schema twice (idempotency) + seed + least-privilege test role
        run: |
          psql -h localhost -U postgres -d copilot -v ON_ERROR_STOP=1 -q -f ../db/schema.sql
          psql -h localhost -U postgres -d copilot -v ON_ERROR_STOP=1 -q -f ../db/schema.sql
          psql -h localhost -U postgres -d copilot -v ON_ERROR_STOP=1 -q -f ../db/seed.sql
          psql -h localhost -U postgres -d copilot -v ON_ERROR_STOP=1 -c "CREATE ROLE copilot_it LOGIN PASSWORD 'ci' IN ROLE copilot_app; GRANT USAGE ON SCHEMA public TO copilot_app;"
      - name: Unit + DB integration tests (coverage gate 85%)
        run: pytest --cov --cov-report=term --cov-report=xml
      - name: Dependency audit (OSV/PyPI advisories)
        run: pip-audit --strict -r requirements.txt
      - uses: actions/upload-artifact@v4
        with: { name: engine-coverage, path: engine/coverage.xml }

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --ignore-scripts --no-fund
      - name: Typecheck (strict)
        run: npm run typecheck
      - name: Build
        run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom-web.cdx.json
      - uses: actions/upload-artifact@v4
        with: { name: web-sbom, path: web/sbom-web.cdx.json }

  workflow-and-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate n8n workflow JSON
        run: python3 -c "import json;json.load(open('n8n/workflow.json'))"
      - name: Build images (no push)
        working-directory: .
        run: |
          docker build -f deploy/engine.Dockerfile -t buyer-copilot-engine:ci .
          docker build -f deploy/web.Dockerfile -t buyer-copilot-web:ci .
